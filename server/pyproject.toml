[project]
name = "milkbank"
version = "0.1.0"
description = "NICU breast-milk inventory server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "sqlalchemy>=2",
    "argon2-cffi",
    "pydantic>=2",
    "uvicorn",
    "tzdata",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
milkbank-create-admin = "milkbank.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milkbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
