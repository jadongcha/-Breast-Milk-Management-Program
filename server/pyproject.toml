[project]
name = "milkbank"
version = "0.1.0"
description = "NICU breast-milk inventory server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "sqlalchemy>=2",
    "argon2-cffi",
    "pydantic>=2",
    "uvicorn",
    "tzdata",
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "qrcode[png]>=8.2",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
milkbank-create-admin = "milkbank.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milkbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
